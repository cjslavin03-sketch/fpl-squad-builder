<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Squad Builder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

header {
    background: #37003c;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    opacity: .85;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.status {
    background: white;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.stat-title {
    font-size: 12px;
    color: #777;
    text-transform: uppercase;
}

.stat-value {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

input, select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

input {
    flex: 1;
    min-width: 200px;
}

.players {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
    gap: 12px;
}

.player {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.player h3 {
    margin: 0 0 5px;
}

.position {
    font-size: 12px;
    font-weight: bold;
    color: #37003c;
}

.team {
    color: #666;
    font-size: 13px;
    margin-top: 4px;
}

.price {
    font-weight: bold;
    margin-top: 8px;
}

.stats {
    margin-top: 8px;
    font-size: 13px;
    color: #555;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    background: #37003c;
    color: white;
    font-weight: bold;
}

button:disabled {
    background: #aaa;
}

.squad {
    margin-top: 30px;
}

.squad-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 10px;
}

.slot {
    background: white;
    border-radius: 10px;
    min-height: 90px;
    padding: 10px;
    text-align: center;
    border: 2px dashed #ccc;
}

.slot strong {
    display: block;
    margin-bottom: 5px;
}

.remove {
    background: #d32f2f;
    font-size: 11px;
    padding: 5px 8px;
    margin-top: 5px;
}

.loading {
    text-align: center;
    padding: 30px;
    background: white;
    border-radius: 10px;
}

.error {
    color: #b00020;
    font-weight: bold;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .squad-grid {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>⚽ FPL Squad Builder</h1>
    <p>Live Fantasy Premier League data</p>
</header>

<div class="container">

    <div class="status" id="status">
        Loading current FPL player data...
    </div>

    <div class="dashboard">

        <div class="stat">
            <div class="stat-title">Budget</div>
            <div class="stat-value">£100.0m</div>
        </div>

        <div class="stat">
            <div class="stat-title">Spent</div>
            <div class="stat-value" id="spent">£0.0m</div>
        </div>

        <div class="stat">
            <div class="stat-title">Remaining</div>
            <div class="stat-value" id="remaining">£100.0m</div>
        </div>

    </div>

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search players..."
            oninput="renderPlayers()"
        >

        <select id="positionFilter" onchange="renderPlayers()">
            <option value="ALL">All Positions</option>
            <option value="1">Goalkeepers</option>
            <option value="2">Defenders</option>
            <option value="3">Midfielders</option>
            <option value="4">Forwards</option>
        </select>

    </div>

    <h2>Players</h2>

    <div class="players" id="players">
        <div class="loading">
            Loading players...
        </div>
    </div>

    <div class="squad">

        <h2>Your Squad</h2>

        <p id="squadStatus">
            0 / 15 players selected
        </p>

        <div class="squad-grid" id="squad"></div>

    </div>

</div>

<script>

let players = [];
let teams = [];
let squad = [];

const FPL_URL =
    "https://jolly-glitter-bb07.cjslavin03.workers.dev";

async function loadFPLData() {

    try {

        const response = await fetch(FPL_URL);

        if (!response.ok) {
            throw new Error("FPL server returned an error.");
        }

        const data = await response.json();

        teams = data.teams;

        players = data.elements;

        document.getElementById("status").innerHTML =
            "✅ Loaded " +
            players.length +
            " players from the official FPL database.";

        renderPlayers();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            '<span class="error">' +
            "⚠️ Could not load live FPL data. " +
            "The FPL data server may be blocking browser requests." +
            "</span>";

        document.getElementById("players").innerHTML =
            '<div class="loading">' +
            "Live player data could not be loaded." +
            "</div>";

    }

}

function getTeamName(teamId) {

    const team = teams.find(
        team => team.id === teamId
    );

    return team ? team.name : "Unknown";

}

function getPositionName(position) {

    const positions = {
        1: "GK",
        2: "DEF",
        3: "MID",
        4: "FWD"
    };

    return positions[position] || "";

}
function calculateAnalytics(player) {

    const points = Number(player.total_points) || 0;
    const form = Number(player.form) || 0;
    const ppg = Number(player.points_per_game) || 0;
    const minutes = Number(player.minutes) || 0;
    const price = (Number(player.now_cost) || 0) / 10;

    const value =
        price > 0 ? points / price : 0;

    const minutesScore =
        Math.min(minutes / 900, 1);

    const valueScore =
        Math.min(value / 12, 1);

    const formScore =
        Math.min(form / 10, 1);

    const ppgScore =
        Math.min(ppg / 8, 1);

    const overall =
        (
            valueScore * 25 +
            formScore * 25 +
            ppgScore * 30 +
            minutesScore * 20
        );

    return {
        value: value,
        overall: overall
    };
}
function renderPlayers() {

    const container =
        document.getElementById("players");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    const filter =
        document
            .getElementById("positionFilter")
            .value;

    container.innerHTML = "";

    const filtered =
        players
            .filter(player => {

                const first =
                    player.first_name || "";

                const last =
                    player.second_name || "";

                const name =
                    (first + " " + last)
                        .toLowerCase();

                return name.includes(search);

            })
            .filter(player => {

                return filter === "ALL" ||
                    String(player.element_type) === filter;

            })
            .slice(0,100);

    filtered.forEach(player => {

        const name =
            player.first_name +
            " " +
            player.second_name;

        const selected =
            squad.some(
                p => p.id === player.id
            );

        const card =
            document.createElement("div");
const analytics =
    calculateAnalytics(player);
        card.className = "player";

        card.innerHTML = `

            <h3>${name}</h3>

            <div class="position">
                ${getPositionName(player.element_type)}
            </div>

            <div class="team">
                ${getTeamName(player.team)}
            </div>

            <div class="price">
                £${(player.now_cost / 10).toFixed(1)}m
            </div>

            <div class="stats">
    Points: ${player.total_points || 0}<br>
    Points/Game: ${player.points_per_game || "0"}<br>
    Form: ${player.form || "0"}<br>
    Ownership: ${player.selected_by_percent || "0"}%<br>
    Value: ${analytics.value.toFixed(2)} pts/£m
</div>

<div style="
    margin-top:10px;
    padding:8px;
    background:#f0eef1;
    border-radius:8px;
    font-weight:bold;
">
    ⭐ Analytics Score:
    ${analytics.overall.toFixed(1)}/100
</div>

            <br>

            <button
                onclick="addPlayer(${player.id})"
                ${selected ? "disabled" : ""}
            >
                ${selected ? "Selected" : "Add Player"}
            </button>

        `;

        container.appendChild(card);

    });

}

function addPlayer(id) {

    if (squad.length >= 15) {

        alert(
            "Your squad already has 15 players."
        );

        return;

    }

    const player =
        players.find(
            p => p.id === id
        );

    if (!player) return;

    const price =
        player.now_cost / 10;

    const spent =
        squad.reduce(
            (sum,p) =>
                sum + (p.now_cost / 10),
            0
        );

    if (spent + price > 100) {

        alert(
            "You don't have enough budget."
        );

        return;

    }

    squad.push(player);

    updateSquad();

    renderPlayers();

}

function removePlayer(index) {

    squad.splice(index,1);

    updateSquad();

    renderPlayers();

}

function updateSquad() {

    const container =
        document.getElementById("squad");

    container.innerHTML = "";

    squad.forEach((player,index) => {

        const name =
            player.first_name +
            " " +
            player.second_name;

        const slot =
            document.createElement("div");

        slot.className = "slot";

        slot.innerHTML = `

            <strong>${name}</strong>

            <small>
                ${getPositionName(
                    player.element_type
                )}
            </small>

            <br>

            £${(
                player.now_cost / 10
            ).toFixed(1)}m

            <br>

            <button
                class="remove"
                onclick="removePlayer(${index})"
            >
                Remove
            </button>

        `;

        container.appendChild(slot);

    });

    const spent =
        squad.reduce(
            (sum,p) =>
                sum + (p.now_cost / 10),
            0
        );

    document.getElementById("spent").innerText =
        "£" + spent.toFixed(1) + "m";

    document.getElementById("remaining").innerText =
        "£" + (100 - spent).toFixed(1) + "m";

    document.getElementById("squadStatus").innerText =
        squad.length +
        " / 15 players selected";

}

loadFPLData();

</script>

</body>
</html>
